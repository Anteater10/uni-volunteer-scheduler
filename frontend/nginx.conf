# Static serving for the React SPA. The Caddy edge (see Caddyfile) terminates TLS
# and routes /api/* to the backend; this nginx only serves the built front-end and
# falls back to index.html so client-side routes (React Router) resolve.
#
# Security headers: the backend sets its own on API responses (app/main.py), and
# Caddy sets HSTS at the edge — but neither covers the HTML and JavaScript, which
# is exactly the surface a CSP and X-Frame-Options exist to protect. The SPA was
# served with no headers at all, so the app could be framed for clickjacking and
# an injected script had no policy standing in its way.
#
# nginx's add_header does NOT inherit into a location block that defines its own
# add_header — the /assets/ and =/index.html blocks below each set Cache-Control,
# which would silently drop every server-level header for those responses. Rather
# than repeat the list three times, Cache-Control is set with `map` + a single
# add_header at server level so no location needs its own.
map $uri $cache_control {
    default              "no-cache";
    ~^/assets/           "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version on responses and error pages.
    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # connect-src stays 'self' because Caddy serves the API from this same
    # origin under /api/*. If the API is ever split onto its own hostname,
    # that hostname must be added here or every request will be blocked.
    # style-src needs 'unsafe-inline' for Tailwind's injected styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets are immutable — cached hard via the map above.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback. The HTML shell is never cached, so new deploys are
    # picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
