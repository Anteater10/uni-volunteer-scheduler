# Development stack. For production use docker-compose.prod.yml.
#
# BAKE_MODEL_WEIGHTS defaults to 0 here, unlike the Dockerfile's own default of
# 1. Baking the ~1.3GB of copilot model weights is what we want in the image we
# deploy, but paying for it on every local rebuild fills a laptop disk, and in
# CI — which has no layer cache — it is a fresh 1.3GB download per run. Off
# here means the models download at runtime on the first copilot question
# instead; nothing else changes. Set BAKE_MODEL_WEIGHTS=1 in your environment
# to reproduce a production-shaped image locally.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: uni_volunteer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uni_volunteer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BAKE_MODEL_WEIGHTS: ${BAKE_MODEL_WEIGHTS:-0}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BAKE_MODEL_WEIGHTS: ${BAKE_MODEL_WEIGHTS:-0}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.seed_admin"
    restart: "no"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BAKE_MODEL_WEIGHTS: ${BAKE_MODEL_WEIGHTS:-0}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      backend:
        condition: service_started
    command: celery -A app.celery_app.celery worker -l info
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BAKE_MODEL_WEIGHTS: ${BAKE_MODEL_WEIGHTS:-0}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      backend:
        condition: service_started
    command: celery -A app.celery_app.celery beat -l info -S redbeat.RedBeatScheduler
    restart: unless-stopped

volumes:
  pgdata:
