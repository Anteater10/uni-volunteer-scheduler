# Project-specific Semgrep rules.
#
# Written for P1 / SCRUM-8 after discovering that Semgrep's published rulesets
# (p/security-audit, p/secrets, p/javascript, p/react, p/python) return ZERO
# findings on this repo — including on frontend/src/lib/authStorage.js, which
# is the subject of F1. The claim that "Semgrep would have caught F1" was
# wrong. These rules make it true.
rules:
  - id: uvs-auth-token-in-web-storage
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Auth token written to localStorage/sessionStorage. Any JavaScript on the
      origin can read it, so an XSS or a compromised dependency takes the
      session. The existing staff tokens are a KNOWN exception, not an accepted
      design: Gate 0 #2 (2026-09-07) ruled that storage gets fixed properly in
      Phase L3 — HttpOnly cookie for the refresh token, access token in memory
      — and closed the PR that proposed accepting it. The compensating control
      until then is the 2-day refresh window, with the reasoning in
      backend/app/config.py:45-53; the finding itself is F1 in
      docs/security-review-frontend-infra.md, which recommends the same fix.
      That exception covers the existing call sites in authStorage.js and
      nothing else. A NEW token reaching web storage is not covered: use an
      HttpOnly cookie.
    paths:
      exclude:
        # The known pre-L3 call sites. Do not widen this exclusion — the
        # direction of travel is to empty this file of web-storage writes.
        # Phase L3 removes them, at which point this exclusion (and probably
        # this rule's exception wording) should go with them.
        - frontend/src/lib/authStorage.js
        # Tests legitimately seed tokens into storage to exercise the very
        # code paths above; flagging them is noise, not signal.
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.jsx"
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, ...)
          - pattern: sessionStorage.setItem($KEY, ...)
          - pattern: window.localStorage.setItem($KEY, ...)
          - pattern: window.sessionStorage.setItem($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|auth|secret|credential|password|session).*

  - id: uvs-refresh-window-widened
    languages: [python]
    severity: ERROR
    message: >-
      refresh_token_expires_days is being set above 2. The window stays at 2 or
      lower: raising it reopens F1, because both tokens live in localStorage.
      The rationale is in backend/app/config.py:45-53, which also records that
      this stays narrow AFTER the Phase L3 storage fix lands — the two changes
      are complementary, not alternatives. Note the
      volunteer magic-link TTL (SIGNUP_CONFIRM_TTL_MINUTES = 20160, i.e. 14
      days) is a SEPARATE constant and is deliberately unchanged — the two are
      not meant to match.
    patterns:
      - pattern: "refresh_token_expires_days: int = $N"
      - metavariable-comparison:
          metavariable: $N
          comparison: $N > 2

# A third rule (public endpoints missing the visibility allow-list) was drafted
# and REMOVED: the real query in backend/app/routers/public/events.py is built
# across several statements and filters correctly at line 215, but the rule
# flagged it anyway. A rule that fires on correct code is worse than no rule --
# it is how a scanner becomes something people click past. If this is worth
# expressing, it needs a dataflow rule, not a syntactic one.
