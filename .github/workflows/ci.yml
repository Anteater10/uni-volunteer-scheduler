name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------
  # Phase 0 Plan 07: backend + frontend + E2E + critical-path coverage.
  # The pre-Plan-07 backend-ci job was removed — phase0-backend-tests is
  # a strict superset (adds redis service + alembic + coverage gates).
  # -------------------------------------------------------------------
  phase0-backend-tests:
    name: phase0 backend tests + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        # Phase 31 — pgvector extension is required by migration 0019.
        # Must match the dev/prod image (docker-compose.yml).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uni_volunteer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uni_volunteer
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: 60
      REFRESH_TOKEN_EXPIRES_DAYS: 14

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          # BASE-CONFIG-33: the lockfile, not requirements.txt. The image is
          # built from the lock, so installing the loose file here would let CI
          # test a different set of transitive versions than production runs —
          # the exact failure the lockfile exists to prevent, with a green tick
          # on it. tests/test_requirements_lock.py keeps the two in step.
          pip install -r requirements.lock.txt

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE test_uvs;"

      - name: alembic upgrade head
        run: |
          cd backend
          alembic upgrade head

      - name: pytest with JSON coverage (branch=True via .coveragerc)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_uvs
        run: |
          cd backend
          pytest --cov=app --cov-report=json --cov-report=term --cov-branch

      - name: Critical-path + per-package coverage gates
        run: |
          cd backend
          python - <<'PY'
          import json, sys
          data = json.load(open("coverage.json"))
          files = data.get("files", {})

          # ---- Per-file gates (signup/celery critical path) -----------------
          # Use covered_lines/num_statements explicitly. percent_covered now
          # blends branch coverage (cov-branch enabled), so a file at 100%
          # line but <100% branch would falsely trip a line-coverage gate.
          def cov_for(suffix):
              for path, info in files.items():
                  if path.endswith(suffix):
                      sm = info["summary"]
                      n = sm["num_statements"]
                      return (sm["covered_lines"] / n) if n else 1.0
              return None
          per_file = {
              "app/signup_service.py": 1.00,
              "app/routers/signups.py": 1.00,
              "app/celery_app.py": 1.00,
          }
          failed = []
          for suffix, floor in per_file.items():
              pct = cov_for(suffix)
              if pct is None:
                  failed.append(f"{suffix}: NOT FOUND in coverage.json")
                  continue
              print(f"{suffix}: line={pct:.3f} (floor {floor})")
              if pct < floor:
                  failed.append(f"{suffix}: {pct:.3f} < {floor}")

          # ---- Per-package gates (Phase 31 follow-up) -----------------------
          # Locks the "every statement in copilot/corpus is exercised" claim.
          # Branch coverage is reported but not gated — the remaining ~6%
          # branch gaps are loop-exit edges, not real logic.
          def pkg_pct(prefix):
              s = c = 0
              for path, info in files.items():
                  if path.startswith(prefix):
                      sm = info["summary"]
                      s += sm["num_statements"]
                      c += sm["covered_lines"]
              return (c / s) if s else 0.0
          per_pkg = {
              "app/copilot": 0.95,
              "app/copilot/retrieval": 0.95,
              "app/copilot/feedback": 0.95,
              "app/corpus": 0.95,
          }
          for prefix, floor in per_pkg.items():
              pct = pkg_pct(prefix)
              print(f"{prefix}/*: line={pct:.3f} (floor {floor})")
              if pct < floor:
                  failed.append(f"{prefix}/*: {pct:.3f} < {floor}")

          if failed:
              print("COVERAGE GATE FAILED:")
              for f in failed:
                  print("  -", f)
              sys.exit(1)
          PY

      # ---- Phase 32-08: per-package gates as standalone pytest invocations -----
      # Mirrors Phase 31-followup (75f1145) discipline but expressed as three
      # independent pytest --cov-fail-under runs (one per namespace). `-o addopts=""`
      # overrides backend/pytest.ini's global `--cov=app` so each invocation
      # measures only the requested package. A future PR that loosens any of
      # these gates (e.g. drops --cov-fail-under to 90) will fail the regression
      # test in backend/tests/test_coverage_gates.py.
      - name: Coverage gate — app.copilot
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_uvs
        run: |
          cd backend
          pytest -o addopts="" --cov=app.copilot --cov-branch --cov-fail-under=95 --cov-report=term-missing tests/

      - name: Coverage gate — app.copilot.retrieval
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_uvs
        run: |
          cd backend
          pytest -o addopts="" --cov=app.copilot.retrieval --cov-branch --cov-fail-under=95 --cov-report=term-missing tests/

      - name: Coverage gate — app.corpus
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_uvs
        run: |
          cd backend
          pytest -o addopts="" --cov=app.corpus --cov-branch --cov-fail-under=95 --cov-report=term-missing tests/

      - name: Coverage gate — app.copilot.feedback
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_uvs
        run: |
          cd backend
          pytest -o addopts="" --cov=app.copilot.feedback --cov-branch --cov-fail-under=95 --cov-report=term-missing tests/

  phase0-frontend-tests:
    name: phase0 frontend vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: npm run test (vitest)
        run: |
          cd frontend
          npm run test -- --run

  # v1.1 E2E: full public volunteer flow, orientation modal, organizer check-in, admin smoke.
  e2e-tests:
    name: playwright e2e
    needs: [phase0-backend-tests, phase0-frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare backend .env for docker-compose
        run: |
          cat > backend/.env <<EOF
          DATABASE_URL=postgresql://postgres:postgres@db:5432/uni_volunteer
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SECRET=test-secret
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRES_MINUTES=60
          REFRESH_TOKEN_EXPIRES_DAYS=14
          SEED_ADMIN_EMAIL=admin@e2e.example.com
          SEED_ADMIN_PASSWORD=Admin!2345
          EXPOSE_TOKENS_FOR_TESTING=1
          EOF

      - name: docker compose up
        run: |
          docker compose up -d db redis
          docker compose run --rm migrate
          docker compose up -d backend celery_worker celery_beat
          # wait for backend
          for i in $(seq 1 40); do
            # /api/v1/health — not healthz. The old spelling 404s, so this loop
            # was passing purely on the /docs fallback and never exercised the
            # health check at all. Same path Rafael points a load balancer at.
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1 \
               || curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              echo "backend up"; break
            fi
            sleep 2
          done

      - name: Install root playwright deps + browsers
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Install frontend + start dev server
        run: |
          cd frontend
          npm ci
          # VITE_COPILOT_ENABLED gates the copilot FAB (CopilotFab.jsx); the
          # copilot e2e specs mock all copilot backend routes, so no LLM calls.
          (VITE_COPILOT_ENABLED=true npm run dev -- --host 0.0.0.0 --port 5173 &)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              echo "frontend up"; break
            fi
            sleep 2
          done

      - name: Run playwright tests
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_BACKEND_URL: http://localhost:8000
          EXPOSE_TOKENS_FOR_TESTING: "1"
        run: |
          npx playwright test

      - name: Upload playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down docker compose
        if: always()
        run: docker compose down -v
