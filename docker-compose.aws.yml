# EC2 + RDS single-host stack for uni-volunteer-scheduler.
#
# Same production topology as docker-compose.prod.yml, minus the local `db`
# container: Postgres runs on a managed RDS instance instead. Redis, Celery,
# the FastAPI backend, the static frontend, and the Caddy edge (automatic
# HTTPS) still run as containers on this one EC2 host.
#
# Prereqs (see docs/deployment-aws.md for the full runbook):
#   - An RDS PostgreSQL 16.x instance already created, with the `vector`
#     extension available (RDS ships it for all 16.x builds — no parameter
#     group change needed). Migration 0019 runs `CREATE EXTENSION IF NOT
#     EXISTS vector` for you on first `alembic upgrade head`.
#   - The RDS security group allows inbound 5432 from THIS EC2 instance's
#     security group (by SG ID, not by CIDR/IP).
#   - A domain name with a DNS A record pointed at this instance's
#     Elastic IP (required for Caddy's automatic Let's Encrypt cert — it
#     cannot issue a cert for a bare IP).
#
# Usage (run from the repo root on the EC2 instance):
#   cp backend/.env.production.example backend/.env.production   # then fill in
#   # Point DATABASE_URL at the RDS endpoint (found on the RDS console's
#   # "Connectivity & security" tab), and require TLS to RDS:
#   #   DATABASE_URL=postgresql://uvs_app:PASSWORD@<rds-endpoint>:5432/uni_volunteer?sslmode=require
#   #
#   # Unlike docker-compose.prod.yml, there is no local db container, so you
#   # do NOT need to set POSTGRES_PASSWORD — the RDS password only lives
#   # inside DATABASE_URL in backend/.env.production.
#   #
#   # DOMAIN / VITE_API_URL / VITE_COPILOT_ENABLED go in .env at the repo root
#   # (Compose auto-loads it — no `export` needed, and it survives a new SSH
#   # session, unlike a shell export). Do NOT type them as `export ...`
#   # commands by hand: a copy-pasted placeholder left unsubstituted (e.g.
#   # literally "<your domain>") passes straight through to Caddy, which then
#   # crash-loops trying to issue a cert for that literal string — this has
#   # actually happened. cp'ing the tracked example and editing it is the
#   # only version of this step to follow:
#   cp .env.aws.example .env   # then edit DOMAIN to the real hostname
#   docker compose -f docker-compose.aws.yml up -d --build
#
#   # Verify:
#   curl https://$(grep -m1 ^DOMAIN= .env | cut -d= -f2)/api/v1/health
#   docker compose -f docker-compose.aws.yml ps

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: run migrations (incl. `CREATE EXTENSION vector`) against RDS,
  # then seed the admin user. There is no local db healthcheck to gate on
  # here (RDS isn't a compose service) — make sure the RDS instance's status
  # is "Available" before you `docker compose up`, or this will just retry
  # connection failures until it errors out.
  #
  # No `build:` here (or on celery_worker/celery_beat below): they, backend,
  # and migrate are the exact same Dockerfile/context/args, so a separate
  # `build:` per service made BuildKit export four full copies of the same
  # several-GB image (torch + scipy + sklearn + baked model weights) at the
  # end of every build — that alone filled the AWS host's disk. `image:`
  # instead makes them reuse the one image `backend` builds. `docker compose
  # up --build` still builds `backend` first (compose completes the build
  # phase for every service that HAS a `build:` before starting any
  # container), so this image exists by the time migrate/celery start.
  migrate:
    image: uni-volunteer-scheduler-backend:latest
    env_file:
      - ./backend/.env.production
    command: sh -c "alembic upgrade head && python -m app.seed_admin"
    restart: "no"

  backend:
    image: uni-volunteer-scheduler-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # --proxy-headers / --forwarded-allow-ips: trust X-Forwarded-For from
    # Caddy so the per-IP rate limiter keys on the real client. Unchanged
    # from docker-compose.prod.yml — Caddy still overwrites XFF itself
    # (see Caddyfile), and the compose bridge CIDR is what's pinned here,
    # not Caddy's (unstable) address on it.
    #
    # --workers: matches this host's 2 vCPUs, not a general default. Each
    # worker is a separate process, so each independently loads the copilot
    # reranker (~278MB) and embedding model (~130MB) plus torch's own runtime
    # the first time it serves a copilot request — confirmed on the AWS box
    # at --workers 4: backend alone held 2.5GiB of the host's 3.7GiB (67.7%),
    # leaving 144MB free and pushing the host into swap. Raise this only
    # alongside more memory, and expect ~roughly linear growth per worker
    # once copilot has been exercised.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=172.16.0.0/12
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  celery_worker:
    image: uni-volunteer-scheduler-backend:latest
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.celery_app.celery worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  celery_beat:
    image: uni-volunteer-scheduler-backend:latest
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.celery_app.celery beat -l info -S redbeat.RedBeatScheduler
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL e.g. https://scitrek.example.org}
        VITE_COPILOT_ENABLED: ${VITE_COPILOT_ENABLED:?set VITE_COPILOT_ENABLED=true or false — unset used to default to false, which builds a healthy frontend with no copilot in it}
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN e.g. scitrek.example.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  redisdata:
  caddy_data:
  caddy_config:
